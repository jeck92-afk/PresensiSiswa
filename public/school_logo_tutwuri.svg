<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="goldGradTut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="flameGradTut" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="shadowTut" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Pentagon / Star Polygon Shape Base (Standard Indonesian Emblem) -->
  <polygon points="100,10 185,72 153,174 47,174 15,72" fill="#0c4a6e" filter="url(#shadowTut)" />
  <polygon points="100,14 180,74 149,170 51,170 20,74" fill="url(#bgGradTut)" stroke="url(#goldGradTut)" stroke-width="3" />

  <!-- Inner Concentric Border -->
  <polygon points="100,22 172,76 144,162 56,162 28,76" fill="none" stroke="#e0f2fe" stroke-width="1.2" stroke-dasharray="4,2" opacity="0.7" />

  <!-- Wings of Knowledge (Tut Wuri Handayani Inspiration) -->
  <!-- Left Wing -->
  <g fill="url(#goldGradTut)" opacity="0.95">
    <path d="M 96,105 C 72,90 42,92 36,112 C 48,110 68,115 88,124 Z" />
    <path d="M 96,114 C 76,106 48,112 44,126 C 56,124 74,127 92,132 Z" />
    <path d="M 96,124 C 80,120 58,126 54,138 C 66,135 80,137 94,140 Z" />
  </g>
  <!-- Right Wing -->
  <g fill="url(#goldGradTut)" opacity="0.95">
    <path d="M 104,105 C 128,90 158,92 164,112 C 152,110 132,115 112,124 Z" />
    <path d="M 104,114 C 124,106 152,112 156,126 C 144,124 126,127 108,132 Z" />
    <path d="M 104,124 C 120,120 142,126 146,138 C 134,135 120,137 106,140 Z" />
  </g>

  <!-- Flaming Torch in Center -->
  <!-- Flame -->
  <path d="M 100,42 C 112,56 118,72 108,86 C 104,91 96,91 92,86 C 82,72 88,56 100,42 Z" fill="url(#flameGradTut)" filter="url(#shadowTut)" />
  <path d="M 100,56 C 105,65 107,72 103,79 C 101,82 99,82 97,79 C 93,72 95,65 100,56 Z" fill="#ffffff" opacity="0.9" />
  <!-- Torch Shaft & Sconce -->
  <path d="M 93,88 L 107,88 L 104,112 L 96,112 Z" fill="url(#goldGradTut)" stroke="#b45309" stroke-width="0.8" />
  <rect x="91" y="87" width="18" height="4" rx="1.5" fill="#fef08a" />

  <!-- Open Book at Lower Base -->
  <g filter="url(#shadowTut)">
    <path d="M 100,128 C 114,122 136,125 146,130 L 146,150 C 136,145 114,142 100,148 C 86,142 64,145 54,150 L 54,130 C 64,125 86,122 100,128 Z" fill="#f8fafc" stroke="url(#goldGradTut)" stroke-width="1.8" />
    <line x1="100" y1="128" x2="100" y2="148" stroke="#94a3b8" stroke-width="1.5" />
  </g>

  <!-- Five-pointed star atop the torch -->
  <polygon points="100,24 102,30 108,30.5 103,34 105,40 100,36.5 95,40 97,34 92,30.5 98,30" fill="url(#goldGradTut)" />

  <!-- School Text Banner at Bottom -->
  <rect x="55" y="154" width="90" height="15" rx="4" fill="#0f172a" stroke="url(#goldGradTut)" stroke-width="1" />
  <text x="100" y="164.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="6.8" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1">TUT WURI HANDAYANI</text>
</svg>
